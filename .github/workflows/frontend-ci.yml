name: Frontend CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

  # Weekly run so npm audit / audit-ci re-checks against newly published
  # advisories even when nobody touches this repo for a while.
  # CAUTION: GitHub auto-disables scheduled workflows after 60 days of repo
  # inactivity — during a long-dormant stretch this stops firing silently.
  # A cross-repo watchdog (outside this repo) is needed to catch that; see
  # _work/handoff-nene2-python-2026-08-12-schedule-rollout-note.md §9.
  schedule:
    - cron: '55 0 * * 1' # Monday 00:55 UTC = 09:55 JST

  workflow_dispatch:
    inputs:
      simulate_failure:
        description: '意図的に frontend-check を失敗させ、失敗通知の経路を検証する'
        type: boolean
        default: false

concurrency:
  # github.event_name is required here: without it, schedule/workflow_dispatch
  # runs get cancelled by a concurrent push run to the same ref (observed in
  # nene-origin's rollout).
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  frontend-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Placed right after Checkout, not at the job's head: this job has
      # defaults.run.working-directory: frontend, which does not exist before
      # Checkout. A step placed before Checkout would fail on `cd` itself
      # instead of at `exit 1`, making the log's stated cause misleading.
      - name: Simulate failure (validation only)
        if: inputs.simulate_failure
        run: exit 1

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # `build` is in the chain because `build-storybook` does not stand in for it:
      # .storybook/main.ts only bundles src/shared/ui/**/*.stories.*, so main.tsx and
      # everything reachable only from it (app/, entities/, features/, pages/) is never
      # bundled by any other gate. tsc checks those files' types but not module
      # resolution. See docs/development/frontend-standards.md.
      - name: Check (type-check, lint, format, test, knip, build, build-storybook)
        run: npm run check

      # audit-ci = npm audit + a per-advisory allowlist, so a not-yet-fixable advisory can be
      # excepted with a written, expiring reason instead of blunting the whole gate. Anything
      # high/critical that is not listed in frontend/audit-ci.jsonc still fails.
      # Policy: docs/development/dependency-audit.md
      - name: Audit (fail on high/critical)
        run: npm run audit

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser (chromium)
        run: npx playwright install --with-deps chromium

      # @smoke first: the critical path (boot → sign in → shell → SPA nav) runs
      # in seconds, so a broken bundle or login wiring fails here instead of
      # after the full suite. Both runs are hermetic (page.route stubs).
      - name: Run @smoke
        run: npm run e2e:smoke

      - name: Run browser E2E tests
        run: npm run e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  notify-failure:
    name: Open an issue when the scheduled run fails
    if: failure() && (github.event_name == 'schedule' || inputs.simulate_failure)
    needs: [frontend-check, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      ISSUE_TITLE: '🔴 [nene-invoice] 週次 CI（schedule）が失敗しています'
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }} # required: this job doesn't checkout, so gh can't infer the repo without it
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Create or update the failure issue
        run: |
          set -euo pipefail
          # 🔴 --limit は 100 では足りない。open が 100 件を超えると同名を取りこぼし、
          # 毎週重複 issue を立てながら「装置は動いている」ように見える。
          # 発現条件が「通知が読まれず溜まっている状態」そのものなので、最も必要なときに壊れる。
          existing="$(gh issue list --state open --limit 1000 --json number,title \
            | jq -r --arg t "$ISSUE_TITLE" 'map(select(.title == $t)) | .[0].number // empty')"
          body="週次の schedule 実行が失敗しました。 実行: ${RUN_URL}"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$ISSUE_TITLE" --body "$body"
          fi
